[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/Le-Syl21/nextcloud-client-rs"
publish = false

[workspace.dependencies]
nc-journal = { path = "crates/nc-journal" }
nc-dav = { path = "crates/nc-dav" }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
regex = "1.13.1"
thiserror = "2.0.21"
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
adler2 = "2.0.1"
tempfile = "3.27.0"
log = "0.4.34"
serde_json = "1.0.151"
http = "1.5.0"
bytes = "1.12.1"
percent-encoding = "2.3.2"
httpdate = "1.0.3"
fastrand = "2.5.0"
nc-sync = { path = "crates/nc-sync" }
nc-testutils = { path = "crates/nc-testutils" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream", "cookies", "gzip", "deflate", "system-proxy"] }
tokio = { version = "1.53.2", features = ["rt", "time", "macros", "sync", "fs", "io-util"] }
tokio-util = "0.7.19"
futures-util = "0.3.34"
quick-xml = "0.42.0"
base64 = "0.23.1"
uuid = { version = "1.27.0", features = ["v4"] }
jiff = "0.2.38"
trash = { version = "5.2.9", default-features = false }
rustix = { version = "1.1.5", features = ["fs", "process"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The ported sync tests move hundreds of megabytes (checksums, chunked
# uploads): optimize the dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
