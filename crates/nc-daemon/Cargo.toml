[package]
name = "nc-daemon"
description = "Daemon logic of nextcloud-client-rs (unofficial port of the Nextcloud desktop client folder manager, folder watcher and account state)"
license = "GPL-2.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nc-journal.workspace = true
nc-dav.workspace = true
nc-sync.workspace = true
nc-platform.workspace = true
interprocess.workspace = true
dirs.workspace = true
log.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
serde_json.workspace = true
regex.workspace = true
serde.workspace = true
http.workspace = true
fastrand.workspace = true
ini-preserve.workspace = true
keyring-core.workspace = true
qrcode.workspace = true
base64.workspace = true
percent-encoding.workspace = true
md-5.workspace = true

[dev-dependencies]
tempfile.workspace = true
nc-testutils.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
nix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
inotify.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo.workspace = true

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true
