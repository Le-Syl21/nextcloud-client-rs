version = 1
SPDX-PackageName = "nextcloud-client-rs"
SPDX-PackageSupplier = "Sylvain Gargasson"
SPDX-PackageDownloadLocation = "https://github.com/Le-Syl21/nextcloud-client-rs"

[[annotations]]
path = ["Cargo.toml", "Cargo.lock", "crates/*/Cargo.toml", ".gitignore", ".cargo/config.toml", "README.md", "CHANGELOG.md", "REUSE.toml", "docs/**", "tools/**", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 nextcloud-client-rs contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
# Copy of upstream test/test_journal.db (see test/test_journal.db.license).
path = ["crates/nc-journal/tests/fixtures/test_journal.db"]
precedence = "override"
SPDX-FileCopyrightText = "2014 ownCloud GmbH"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
# Generated by tools/jhash-oracle from upstream src/common/c_jhash.h.
path = ["crates/nc-journal/tests/fixtures/jhash_vectors.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 nextcloud-client-rs contributors", "2017 ownCloud GmbH", "1997 Bob Jenkins <bob_jenkins@burtleburtle.net>"]
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = ["crates/nc-journal/data/sync-exclude.lst"]
precedence = "override"
SPDX-FileCopyrightText = ["2020 Nextcloud GmbH and Nextcloud contributors", "2012 ownCloud GmbH"]
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
# Hand-written nextcloud.cfg sample (fixture of the nc-daemon configuration tests).
path = ["crates/nc-daemon/testdata/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 nextcloud-client-rs contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"
